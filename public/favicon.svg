<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="4" />

  <!-- Inner Subtle Glow -->
  <circle cx="64" cy="64" r="38" fill="#818cf8" opacity="0.15" filter="url(#softGlow)" />

  <!-- Monogram Logo: Stylized 'A' with code brackets -->
  <g filter="url(#softGlow)">
    <!-- Left Bracket < -->
    <path d="M 32 50 L 22 64 L 32 78" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 96 50 L 106 64 L 96 78" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center 'A' -->
    <path d="M 64 36 L 46 90 L 56 90 L 60.5 76 L 67.5 76 L 72 90 L 82 90 Z M 64 53 L 62.2 68 L 65.8 68 Z" fill="url(#letterGrad)" />
  </g>
</svg>
